name: opengym

services:
  # One-time: download the exercise images + GIFs into named volumes (skipped if already there).
  # ~140 MB, from github.com/hasaneyldrm/exercises-dataset (CC), pinned to verified commit.
  media:
    image: alpine/git
    volumes:
      - opengym_img:/out/img
      - opengym_gif:/out/gif
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -z "$$(ls -A /out/img 2>/dev/null)" ]; then
          echo "↓ Downloading exercise media (~140 MB, one time)…"
          git clone --no-checkout --filter=blob:none https://github.com/hasaneyldrm/exercises-dataset /tmp/ds
          git -C /tmp/ds checkout 7455efae41b330c265e7cd4b78dfa848e7ce5ebd
          cp /tmp/ds/images/*.jpg /out/img/ && cp /tmp/ds/videos/*.gif /out/gif/
          echo "✓ Exercise media ready ($$(ls /out/img | wc -l) images)."
        else
          echo "✓ Exercise media already present — skipping download."
        fi
    restart: "no"

  # Passkey auth + per-user data + AI Coach (Node, no framework).
  api:
    build: ./api
    container_name: opengym-api
    restart: unless-stopped
    environment:
      - PORT=3000
      - DATA_DIR=/data
      - COACH_CODEX_HOME=/codex
      - RP_ID=${RP_ID:-opengym.myportainerserver.duckdns.org}
      - ORIGIN=${ORIGIN:-https://opengym.myportainerserver.duckdns.org}
      - RP_NAME=${RP_NAME:-openGym}
      - SESSION_DAYS=${SESSION_DAYS:-90}
      - ADMIN_UIDS=${ADMIN_UIDS:-}
      - INVITE_ONLY=${INVITE_ONLY:-0}
      - COACH_DISABLED=${COACH_DISABLED:-}
    volumes:
      - opengym_data:/data
      - opengym_codex:/codex
    networks:
      - internal

  # Builds the React frontend (multi-stage) and serves it, proxying /api → api
  # and the exercise media from the shared volume. Single origin for passkeys.
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    container_name: opengym-web
    restart: unless-stopped
    depends_on:
      media:
        condition: service_completed_successfully
      api:
        condition: service_started
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - opengym_img:/usr/share/nginx/html/img:ro
      - opengym_gif:/usr/share/nginx/html/gif:ro
    networks:
      - internal

volumes:
  opengym_data:
  opengym_codex:
  opengym_img:
  opengym_gif:

networks:
  internal:
